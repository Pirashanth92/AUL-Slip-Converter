<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sri Lankan Bank Slip Converter</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>:root{--p:#6c3ef4;--pink:#f43ecb;--bg:#f5f6fb;--ink:#202132;--muted:#6c7280;--line:#e1e3eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 22px}.brand{background:linear-gradient(135deg,var(--p),#b23ef4 52%,var(--pink));color:white;border:2px solid #4b2a9e;border-radius:16px;padding:22px 25px;box-shadow:0 12px 30px #6c3ef42b}.brand h1{margin:0 0 4px;font-size:22px}.brand p{margin:0;color:#f1eaff}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 3px 12px #2021320b}.login{max-width:390px;margin:70px auto}.field{margin:14px 0}.field label{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:1fr 150px 150px;gap:14px;align-items:end}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--p);color:white}.btn:disabled{opacity:.45}.status{color:var(--muted);min-height:21px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f7f8fb;border-radius:10px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px}.banner{padding:12px 14px;border-radius:9px;margin:16px 0}.ok{background:#e8f7ef;color:#1c7445}.warn{background:#fff5dc;color:#76540c}.issues,.preview{background:#fafafd;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--muted);font:12px/1.5 Consolas,monospace;max-height:230px;overflow:auto}.hidden{display:none}.right{text-align:right}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:18px 12px}}</style></head><body><div id="login" class="login"><div class="brand"><h1>Sri Lankan Bank Slip Converter</h1><p>Sign in to continue</p><div class="field"><label style="color:#f1eaff">Username</label><input id="user"></div><div class="field"><label style="color:#f1eaff">Password</label><input id="pass" type="password"></div><button class="btn" style="width:100%;background:white;color:var(--p)" id="loginBtn">Login</button><p id="loginErr" style="display:none;color:#ffd9d5">Incorrect username or password.</p></div></div><main id="app" class="wrap hidden"><div class="brand"><h1>Sri Lankan Bank Slip Converter</h1><p>Upload an Excel sheet. Each row becomes one 150-character fixed-width line.</p></div><section class="card"><div class="grid"><div class="field"><label>Excel file (.xlsx / .xls)</label><input id="file" type="file" accept=".xlsx,.xls"></div><div class="field"><label>Narration account no.</label><input id="acct" value="970880" maxlength="6"></div><div class="field"><label>Narration date DDMMYY</label><input id="ndate" value="260623" maxlength="6"></div></div><div id="status" class="status"></div><div id="result" class="hidden"><div class="stats"><div class="stat"><small>Excel rows</small><strong id="rows">0</strong></div><div class="stat"><small>Lines generated</small><strong id="lines">0</strong></div><div class="stat"><small>Total amount</small><strong id="total">Rs. 0.00</strong></div></div><div id="banner" class="banner"></div><div id="issuesWrap" class="hidden"><b>Rows needing attention</b><div id="issues" class="issues"></div></div><div class="right" style="margin-top:16px"><button id="download" class="btn" disabled>Download bank slip .txt</button></div><details style="margin-top:18px"><summary>Preview first 3 lines</summary><pre id="preview" class="preview"></pre></details></div></section></main><script>(()=>{const $=x=>document.getElementById(x);let lines=[],filename='bankslip.txt';const ORIGIN='7010012000071075145A',TEMPLATE='U LANKA BATTICALOA CRC ALLOWANCE  970880         260623000000';const pad=(v,n,c=' ',l=false)=>{v=String(v);return v.length>=n?v.slice(0,n):(l?c.repeat(n-v.length)+v:v+c.repeat(n-v.length))};const dig=v=>String(v??'').replace(/[^0-9]/g,'');const clean=v=>String(v??'').trim().toUpperCase();const find=(h,ks)=>h.findIndex(x=>ks.some(k=>String(x??'').toLowerCase().includes(k)));function makeNarr(){let a=pad(dig($('acct').value)||'970880',6,'0',true),d=dig($('ndate').value);if(d.length!==6)d='260623';return pad(TEMPLATE.replace('970880',a).replace('260623',d),61)}function process(f){$('status').textContent='Reading file...';try{let wb=XLSX.read(new Uint8Array(f),{type:'array'}),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),h=r[0],bc=find(h,['bank']),br=find(h,['branch']),nc=find(h,['name']),ac=find(h,['account','a/c']),mc=find(h,['amount']);if([bc,br,nc,ac,mc].some(x=>x<0)){throw Error('Required headers: Bank, Branch, Name, Account No, Amount')}let issues=[],total=0,count=0,n=makeNarr();lines=[];for(let i=1;i<r.length;i++){let x=r[i];if(!x||x.every(v=>String(v).trim()===''))continue;count++;let bank=dig(x[bc]),branch=dig(x[br]),acct=dig(x[ac]),name=clean(x[nc]),amt=parseFloat(String(x[mc]).replace(/,/g,'')),bad=[];if(!bank)bad.push('Bank');if(!branch)bad.push('Branch');if(!acct)bad.push('Account');if(!name)bad.push('Name');if(isNaN(amt)){bad.push('Amount');amt=0}if(bad.length)issues.push('Row '+(i+1)+': '+bad.join(', '));let line='0000'+pad(bank,4,'0',true)+pad(branch,3,'0',true)+pad(acct,12,'0',true)+pad(name,20)+'23'+pad(Math.round(amt*100),21,'0',true)+'SLR'+ORIGIN+n;lines.push(pad(line,150));total+=amt}filename=f.name.replace(/\.[^.]+$/,'')+'_bankslip.txt';$('rows').textContent=count;$('lines').textContent=lines.length;$('total').textContent='Rs. '+total.toLocaleString('en-LK',{minimumFractionDigits:2});$('banner').textContent=issues.length?'Line count matches, but review warnings below.':'Line count matches Excel rows. No formatting issues found.';$('banner').className='banner '+(issues.length?'warn':'ok');$('issuesWrap').classList.toggle('hidden',!issues.length);$('issues').textContent=issues.join('\n');$('preview').textContent=lines.slice(0,3).join('\n');$('download').disabled=!lines.length;$('result').classList.remove('hidden');$('status').textContent=''}catch(e){$('status').textContent='Error: '+e.message}}$('loginBtn').onclick=()=>{if($('user').value==='admin'&&$('pass').value==='slip2026'){$('login').classList.add('hidden');$('app').classList.remove('hidden')}else $('loginErr').style.display='block'};$('file').onchange=e=>e.target.files[0]&&process(e.target.files[0]);$('acct').onchange=()=>{$('file').files[0]&&process($('file').files[0])};$('ndate').onchange=()=>{$('file').files[0]&&process($('file').files[0])};$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/plain'}));a.download=filename;a.click()}})();</script><script>document.addEventListener('DOMContentLoaded',function(){  var app=document.getElementById('app');  if(!app)return;  var card=app.querySelector('.card');  var row=document.createElement('div');  row.style='display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:#f7f5ff;border:1px solid #ddd4ff;border-radius:9px';  row.innerHTML='<span style="color:#5a4a9a;font-size:13px">Need the correct Excel format? Download the template with sample headers.</span><button id="templateBtn" class="btn" type="button">Download template Excel</button>';  card.insertBefore(row,card.firstChild);  document.getElementById('templateBtn').onclick=function(){    if(!window.XLSX){alert('Excel library is still loading. Please try again.');return;}    var data=[['Bank','Branch','Name','Account No','Amount'],['7010','001','Sample Customer','123456789012','12500.00']];    var ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();    XLSX.utils.book_append_sheet(wb,ws,'Bank Slip Data');    ws['!cols']=[{wch:12},{wch:12},{wch:24},{wch:18},{wch:14}];    XLSX.writeFile(wb,'Bank_Slip_Template.xlsx');  };});</script><script>/* Robust Excel header detection: accepts a title/blank row before the headers. */(function(){var f=document.getElementById('file');if(!f)return;f.onchange=function(ev){var file=ev.target.files&&ev.target.files[0];if(!file)return;var status=document.getElementById('status');status.textContent='Reading file...';var reader=new FileReader();reader.onload=function(e){try{var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),hi=-1;for(var i=0;i<Math.min(rows.length,10);i++){var s=rows[i].map(function(v){return String(v).toLowerCase()}).join('|');if(s.indexOf('bank')>=0&&s.indexOf('branch')>=0&&s.indexOf('amount')>=0){hi=i;break}}if(hi<0){status.textContent='Error: Could not find the header row. Required: Bank, Branch, Name, Account No, Amount';return}var h=rows[hi],find=function(keys){for(var c=0;c<h.length;c++){var v=String(h[c]).toLowerCase();for(var k=0;k<keys.length;k++)if(v.indexOf(keys[k])>=0)return c}return -1},bc=find(['bank']),br=find(['branch']),nc=find(['name']),ac=find(['account','a/c']),mc=find(['amount']);if([bc,br,nc,ac,mc].some(function(x){return x<0})){status.textContent='Error: Required headers: Bank, Branch, Name, Account No, Amount';return}var out=[],issues=[],total=0,count=0,narr='U LANKA BATTICALOA CRC ALLOWANCE  '+(document.getElementById('acct').value||'970880')+'         '+(document.getElementById('ndate').value||'260623')+'000000';narr=(narr+' '.repeat(61)).slice(0,61);for(var r=hi+1;r<rows.length;r++){var x=rows[r];if(!x||x.every(function(v){return String(v).trim()===''}))continue;count++;var bank=String(x[bc]||'').replace(/\D/g,''),branch=String(x[br]||'').replace(/\D/g,''),acct=String(x[ac]||'').replace(/\D/g,''),name=String(x[nc]||'').trim().toUpperCase(),amt=parseFloat(String(x[mc]||'').replace(/,/g,''));if(isNaN(amt))amt=0;var line='0000'+(bank.padStart(4,'0')).slice(-4)+(branch.padStart(3,'0')).slice(-3)+(acct.padStart(12,'0')).slice(-12)+(name+' '.repeat(20)).slice(0,20)+'23'+String(Math.round(amt*100)).padStart(21,'0')+'SLR7010012000071075145A'+narr;out.push((line+' '.repeat(150)).slice(0,150));total+=amt}window.bankLines=out;window.bankFilename=file.name.replace(/\.[^.]+$/,'')+'_bankslip.txt';document.getElementById('rows').textContent=count;document.getElementById('lines').textContent=out.length;document.getElementById('total').textContent='Rs. '+total.toLocaleString('en-LK',{minimumFractionDigits:2});document.getElementById('banner').textContent='Header row found at Excel row '+(hi+1)+'. '+out.length+' bank-slip lines generated.';document.getElementById('banner').className='banner ok';document.getElementById('preview').textContent=out.slice(0,3).join('\n');document.getElementById('result').classList.remove('hidden');document.getElementById('download').disabled=!out.length;document.getElementById('download').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window.bankLines.join('\r\n')],{type:'text/plain'}));a.download=window.bankFilename;a.click()};status.textContent=''}catch(err){status.textContent='Error reading file: '+err.message}};reader.readAsArrayBuffer(file)}})();</script><script>/* Add a two-character order number (01..15 and onward) to every downloaded line. */(function(){var result=document.getElementById('result'),done=false;new MutationObserver(function(){if(done||!window.bankLines||!window.bankLines.length||result.classList.contains('hidden'))return;window.bankLines=window.bankLines.map(function(line,i){var order=String(i+1).padStart(2,'0');return order+line});document.getElementById('preview').textContent=window.bankLines.slice(0,3).join('\n');document.getElementById('banner').textContent+=' Order number 01–'+String(window.bankLines.length).padStart(2,'0')+' added as the first 2 characters.';done=true}).observe(result,{attributes:true,attributeFilter:['class']})})();</script><script>/* Final order format: remove any first-column 2-digit order and append 3 digits at the end. */(function(){var result=document.getElementById('result'),done=false;new MutationObserver(function(){if(done||!window.bankLines||!window.bankLines.length||result.classList.contains('hidden'))return;window.bankLines=window.bankLines.map(function(line,i){if(/^\d{2}0000/.test(line))line=line.slice(2);return line+String(i+1).padStart(3,'0')});document.getElementById('preview').textContent=window.bankLines.slice(0,3).join('\n');document.getElementById('banner').textContent='3-character order number added as the last column: 001–'+String(window.bankLines.length).padStart(3,'0');done=true}).observe(result,{attributes:true,attributeFilter:['class']})})();</script><script>/* Add one separator space before the final 3-character order number. */(function(){var result=document.getElementById('result'),done=false;new MutationObserver(function(){if(done||!window.bankLines||!window.bankLines.length||result.classList.contains('hidden'))return;window.bankLines=window.bankLines.map(function(line){return line.slice(0,-3)+' '+line.slice(-3)});document.getElementById('preview').textContent=window.bankLines.slice(0,3).join('\n');document.getElementById('banner').textContent+=' Space added before the final order number.';done=true}).observe(result,{attributes:true,attributeFilter:['class']})})();</script><script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.brand').forEach(function(b){var p=document.createElement('p');p.textContent='Developer — Logapirashanth (0703122770)';p.style='margin-top:10px;font-size:12px;color:rgba(255,255,255,.8)';b.appendChild(p)})});</script>
<script>/* Order number placement: immediately after narration account. */(function(){var result=document.getElementById('result'),done=false;new MutationObserver(function(){if(done||!window.bankLines||!window.bankLines.length||result.classList.contains('hidden'))return;window.bankLines=window.bankLines.map(function(line,i){var order=String(i+1).padStart(3,'0');line=line.replace(/\s\d{3}$/,'');var head=line.slice(0,85),n=line.slice(85,146),tail=line.slice(146);n=n.replace(/(\d{6})\s+(\d{6}000000)/,'$1    '+order+'    $2');return(head+n+tail+' '.repeat(150)).slice(0,150)});document.getElementById('preview').textContent=window.bankLines.slice(0,3).join('\n');document.getElementById('banner').textContent='3-character order number added after narration account.';done=true}).observe(result,{attributes:true,attributeFilter:['class']})})();</script></body></html>
